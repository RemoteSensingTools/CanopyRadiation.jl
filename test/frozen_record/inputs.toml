diffuse = 0.3
soil = 1.0

# ------------------------------------------------- empty passive column
# Inputs for which v0.1.0's tuple path (soil * (direct + diffuse)) and vector /
# batch paths (soil * diffuse + soil * direct) differ in the last bit in both
# Float32 and Float64, so each path's own value is pinned.
[[regime_empty_cases]]
