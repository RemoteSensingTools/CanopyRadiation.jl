# --------------------------------------------------------------------------
# Volume emission closures. Uniform strengths are W m-2 per unit LAI.
# Quadrature depths are a 3-point Gauss-Legendre rule on [0, 1].
# --------------------------------------------------------------------------
[emissions.none]
kind = "none"

[emissions.uniform]
kind = "uniform"
upward = 140.0
downward = 135.0

[emissions.quadrature]
kind = "quadrature"
depths = [0.1127016653792583, 0.5, 0.8872983346207417]
weights = [0.2777777777777778, 0.4444444444444444, 0.2777777777777778]
upward = [160.0, 150.0, 140.0]
downward = [150.0, 141.0, 132.0]

# emitting_layer(absorption, backscatter, lai, emission) on a layer case's
