# ##########################################################################
# EXTENSION 2 (appended after commit 479b695): numerical regimes named by the
# refactor reviews. Everything above this banner is frozen and must not change.
# These sections feed reference_regimes.toml. All inputs are manufactured; no
# CanopyOptics computation is involved (the 4SAIL chain uses the manufactured
# [api_foursail_geometry]).
# Units as above: rates per unit LAI, LAI in m2 m-2, passive fluxes normalized,
# emitting fluxes W m-2, photon quantities umol m-2 s-1, wavelengths nm.
# ##########################################################################

# ------------------------------------------------- low sun, deep columns
# Beam extinction k = G / cos(SZA) with G = 0.5 (spherical leaves); the
# scattering source rates scale with k (beam_up = 0.06 k, beam_down = 0.08 k).
[regime_rates.sza85]
description = "SZA 85 deg: k = 0.5 / cos(85 deg) = 5.737"
absorption = 0.15
backscatter = 0.08
beam_up = 0.3442
beam_down = 0.459
extinction = 5.737

[regime_rates.sza89]
description = "SZA 89 deg: k = 0.5 / cos(89 deg) = 28.65"
absorption = 0.15
backscatter = 0.08
beam_up = 1.719
beam_down = 2.292
extinction = 28.65

[regime_rates.sza89_9]
description = "SZA 89.9 deg: k = 0.5 / cos(89.9 deg) = 286.5"
absorption = 0.15
backscatter = 0.08
beam_up = 17.19
beam_down = 22.92
extinction = 286.5

[regime_layers]
description = "thin layers around one optically thick interior layer"
thin_lai = 0.15
thick_lai = 3.0

# Each deep column: n_layers thin layers except a thick layer at
# thick_position, all with one rate set; solved with every listed method on
# the tuple, vector and batch paths. Recorded: direct/down/up at interfaces 1,
# thick_position, thick_position + 1 and n_layers + 1; absorption of the thick
# layer and the column sum of absorption; ground.
[regime_passive_scenarios.mixed_soil02]
direct = 0.7
diffuse = 0.3
soil = 0.2

[regime_passive_scenarios.dark]
description = "darkness: zero direct and zero diffuse"
direct = 0.0
diffuse = 0.0
soil = 0.2

[[regime_deep_columns]]
name = "n20_sza85"
rates = "sza85"
n_layers = 20
thick_position = 10
methods = ["analytic", "native"]
scenarios = ["mixed_soil02"]

[[regime_deep_columns]]
name = "n20_sza89_9"
rates = "sza89_9"
n_layers = 20
thick_position = 10
methods = ["analytic", "native"]
scenarios = ["mixed_soil02"]

[[regime_deep_columns]]
name = "n40_sza89_9"
rates = "sza89_9"
n_layers = 40
thick_position = 20
methods = ["analytic", "native"]
scenarios = ["mixed_soil02"]

[[regime_deep_columns]]
name = "n20_sza85_dark"
rates = "sza85"
n_layers = 20
thick_position = 10
methods = ["analytic"]
scenarios = ["dark"]

# ------------------------------------------------- 4SAIL chain and soil edges
# foursail_canopy_rates(api_foursail_geometry, leaf) -> layer_operator (every
# method) -> one-layer column with soil reflectance exactly 0 and exactly 1.
[regime_foursail_chain]
leaf = "green_leaf"
lai = 1.2
scenarios = ["soil_exactly_0", "soil_exactly_1"]

[regime_passive_scenarios.soil_exactly_0]
