# arithmetic on manufactured inputs) and reference_canopyoptics.toml (values
# that are computed by CanopyOptics code: leaf-angle quadrature, emission
# spectra conditioning, plate escape fates, plate optics).
#
# Additional units
#   cosines (leaf_cosine, source_cosine, ray_cosine, mu, mu_s): dimensionless
#   azimuths (leaf_azimuth, source_azimuth, ray_phi, azimuths): radians
#   beam_normal, down, up (face absorption): photon flux, umol m-2 s-1
#   absorptance, reflectance, transmittance, plate transmissions: dimensionless
#   population depths, lai, lai_above: one-sided LAI, m2 m-2
#   population weights: leaf area per population, m2 m-2 (per depth node)
#   front/back face escapes and fluorescence emission: umol m-2 s-1 (arbitrary)
#   wavelengths, widths, anchors, targets: nm
#   photon_energy coefficient: J nm umol-1 (arbitrary manufactured constant)
#   leaf emission matrices, eta, probabilities: dimensionless photon fractions
#   excitation_energy: arbitrary energy per photon units
#   SIF plus/minus moments: umol m-2 s-1 per unit LAI; physical_channels:
#       umol m-2 s-1 (ground area)
#   Arrays given flat use Julia column-major order with an explicit shape.
# ##########################################################################

