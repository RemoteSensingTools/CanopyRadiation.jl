# Host-dependent tolerances for the CanopyRadiation frozen numerical record.
#
# The record (reference.toml) is bit-for-bit reproducible on hosts whose CPU
# has native fused multiply-add: checked on Julia 1.12.6 and 1.10.12, with and
# without --check-bounds=yes, with 1 and 8 threads (Intel Xeon Platinum 8462Y+,
# native target). On a target WITHOUT native FMA (checked with `julia -C x86-64`),
# Base's Float32 `exp` evaluates its `muladd` polynomial without fusion and
# returns results 1 ulp apart for some arguments. That changes exactly the
# Float32 tables below by at most 1 eps of the reference value; every Float64
# value and every other Float32 value stays bit-identical.
#
# This section is applied ONLY when Core.Intrinsics.have_fma(Float32) is false.
# On FMA hosts (where the record was produced, and GitHub CI runners) the
# comparison is exact. Measured, not estimated; do not widen without a review.

[no_native_fma]
tolerance_eps = 1.0
keys = [
    "Float32/layer_operator/analytic/generic_moderate",
    "Float32/layer_operator/analytic/generic_thick",
    "Float32/diffuse_response/generic_thick",
    "Float32/layer_operator/analytic/near_resonant_moderate",
    "Float32/passive/tuple/single/mixed_bright_soil",
    "Float32/passive/vector/single/mixed_bright_soil",
    "Float32/passive/batch/single/mixed_bright_soil",
    "Float32/emission_interior/none_upper",
]

# --------------------------------------------------------------------------
# Extension tables (reference_api.toml, reference_canopyoptics.toml), measured
# the same way with `julia -C x86-64` on Julia 1.12.6 and 1.10.12 (identical
# results on both). On FMA hosts these tables are bit-exact as well (checked on
# 1.12.6 / 1.10.12, --check-bounds=yes and default, 1 and 8 threads,
# OPENBLAS_NUM_THREADS=1 and default). Every section whose name starts with
# `no_native_fma` applies only when Core.Intrinsics.have_fma(Float32) is false.
# All Float64 values stay bit-identical without FMA. The Float32 differences
# come from Float32 `exp`/`expm1` (1 ulp) propagated through the emitting
# column (layer absorption is a difference of fluxes) and through the
# CanopyOptics plate escape fates.

[no_native_fma_api_8eps]
tolerance_eps = 8.0
keys = [
    "Float32/evaluate_hemispheric_sif_bin/dual/psii_none/bin2",
    "Float32/evaluate_hemispheric_sif_bin/dual/none_psi/bin2",
    "Float32/evaluate_hemispheric_sif_spectrum/dual/psii_psi",
]

[no_native_fma_api_16eps]
tolerance_eps = 16.0
keys = [
    "Float32/evaluate_hemispheric_sif_spectrum/single/psii",
    "Float32/evaluate_hemispheric_sif_spectrum/dual/none_psi",
]

[no_native_fma_canopyoptics_1eps]
tolerance_eps = 1.0
keys = [
    "Float32/canopyoptics/leaf_inclination_quadrature",
]

[no_native_fma_canopyoptics_7eps]
tolerance_eps = 7.0
keys = [
    "Float32/canopyoptics/build_leaf_emission_matrices/births/strict_all_none",
    "Float32/canopyoptics/build_leaf_emission_matrices/births/strict_all_vector",
    "Float32/canopyoptics/build_leaf_emission_matrices/births/strict_subset_tail",
    "Float32/canopyoptics/build_leaf_emission_matrices/front_back_births/full_subset_faces",
]

# --------------------------------------------------------------------------
# Regime tables (reference_regimes.toml), measured with `julia -C x86-64` on
# Julia 1.12.6 and 1.10.12 (identical results). On FMA hosts these tables are
# bit-exact (1.12.6 / 1.10.12, --check-bounds=yes and default, 1 and 8
# threads). Without native FMA, unlike the older tables, some Float64 values
# also change: the AnalyticTwoStream operator of the optically thick layer at
# grazing sun (k L = 17 to 860) and the deep analytic columns built from it.
# NativeTwoStream columns stay bit-identical in both precisions.

[no_native_fma_regimes_1eps]
tolerance_eps = 1.0
keys = [
    "Float64/regimes/layer_operator/analytic/sza89_thick",
    "Float32/regimes/interior_flux_edge/analytic/near_resonant/xlai",
]

[no_native_fma_regimes_f64_2eps]
tolerance_eps = 2.0
keys = [
    "Float64/regimes/layer_operator/analytic/sza85_thick",
    "Float64/regimes/layer_operator/analytic/sza89_9_thick",
]

[no_native_fma_regimes_f64_3eps]
tolerance_eps = 3.0
keys = [
    "Float64/regimes/deep_column/n40_sza89_9/analytic/tuple/mixed_soil02",
    "Float64/regimes/deep_column/n40_sza89_9/analytic/vector/mixed_soil02",
    "Float64/regimes/deep_column/n40_sza89_9/analytic/batch/mixed_soil02",
]

[no_native_fma_regimes_f64_4eps]
tolerance_eps = 4.0
keys = [
    "Float64/regimes/deep_column/n20_sza85/analytic/tuple/mixed_soil02",
    "Float64/regimes/deep_column/n20_sza85/analytic/vector/mixed_soil02",
    "Float64/regimes/deep_column/n20_sza85/analytic/batch/mixed_soil02",
]

[no_native_fma_regimes_f64_5eps]
tolerance_eps = 5.0
keys = [
    "Float64/regimes/deep_column/n20_sza89_9/analytic/tuple/mixed_soil02",
    "Float64/regimes/deep_column/n20_sza89_9/analytic/vector/mixed_soil02",
    "Float64/regimes/deep_column/n20_sza89_9/analytic/batch/mixed_soil02",
]

[no_native_fma_regimes_f32_8eps]
tolerance_eps = 8.0
keys = [
    "Float32/regimes/evaluate_hemispheric_sif_bin/dual_unequal/bin1",
    "Float32/regimes/evaluate_hemispheric_sif_spectrum/dual_unequal",
]

[no_native_fma_regimes_f32_13eps]
tolerance_eps = 13.0
keys = [
    "Float32/regimes/deep_column/n20_sza85/analytic/tuple/mixed_soil02",
    "Float32/regimes/deep_column/n20_sza85/analytic/vector/mixed_soil02",
    "Float32/regimes/deep_column/n20_sza85/analytic/batch/mixed_soil02",
]

# This table contains the absorption of a non-absorbing layer, a cancellation
# residue (1.5e-8 against fluxes of 0.1) whose own eps is meaningless; the
# tolerance is in eps(Float32) times the largest magnitude in the table.
[no_native_fma_regimes_f32_table_scale]
tolerance_mode = "table_scale"
tolerance_eps = 1.0
keys = [
    "Float32/regimes/evaluate_hemispheric_sif_bin/dual_unequal/bin3",
]
